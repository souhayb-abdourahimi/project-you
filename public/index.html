<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws its own safe areas (notch, home indicator). Zoom stays allowed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Coach sport et nutrition qui s’adapte à ton objectif, ton budget et ton emploi du temps." />
    <meta name="color-scheme" content="light dark" />
    <!-- Same colours as the theme background tokens (src/theme/tokens.ts). -->
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />

    <!-- Installed web app (home screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PROJECT YOU" />
    <!-- "default": the status bar keeps its own background, so the clock never sits on our content. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="pwa">
      /* Theme background before the app paints: no white flash in dark mode. */
      html,
      body {
        background-color: #f5f6f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b0d12;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        /* No page bounce behind the app's own scroll views; no grey flash on tap. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* iOS Safari zooms into any field under 16 px on focus: fields are 16 px there, nothing else changes. */
      @supports (-webkit-touch-callout: none) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Project You a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
  </body>
</html>
